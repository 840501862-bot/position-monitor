<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>持仓监控</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
    font-size: 14px; color: #d5dee8; background: #0c1e3e; min-height: 100vh;
  }
  header {
    background: linear-gradient(180deg,#0e1a2c,#0a1322); border-bottom: 1px solid #20334d;
    padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; color: #eaf2ff; margin-right: auto; }
  .toolbar {
    background: #0a1322; border-bottom: 1px solid #20334d; padding: 8px 16px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  button {
    border: 1px solid #2a4d7f; border-radius: 4px; padding: 6px 16px;
    background: #142543; color: #9cc3ff; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: #2f8cff; color: #cfe3ff; }
  button.primary { background: linear-gradient(180deg,#1e7bff,#1460e0); border-color: #2f8cff; color: #fff; }
  #status { color: #4dc3ff; font-size: 12px; }
  .groups { padding: 10px 16px; }
  .group-label {
    font-size: 13px; font-weight: 700; color: #c9ddf5;
    background: #1a3a6e; padding: 6px 12px; border-radius: 6px 6px 0 0;
    border: 1px solid #2c5aa8; border-bottom: none;
  }
  .cards {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    border: 1px solid #2c5aa8; border-radius: 0 6px 6px 6px;
    padding: 10px; background: rgba(20,35,74,.4);
  }
  .card {
    min-width: 150px; background: #142543; border: 1px solid #2a4d7f;
    border-radius: 6px; padding: 10px 12px;
  }
  .card .c-sym { font-weight: 700; color: #fff; font-size: 14px; margin-bottom: 6px; }
  .card .c-row { display: flex; justify-content: space-between; font-size: 12px; line-height: 1.8; }
  .card .c-row .lbl { color: #7d93ab; }
  .card .c-empty { color: #5f7d9e; font-size: 12px; padding: 8px 0; text-align: center; }
  .long { color: #ef4444; font-weight: 700; }
  .short { color: #22c55e; font-weight: 700; }
  .num { font-family: Consolas, monospace; }
  .roi-pos { color: #ef4444; font-weight: 700; }
  .roi-neg { color: #22c55e; font-weight: 700; }
  .empty { text-align: center; padding: 40px; color: #5f7d9e; }
  .mask {
    position: fixed; inset: 0; background: rgba(3,6,12,.7); display: none;
    align-items: center; justify-content: center; z-index: 50;
  }
  .mask.show { display: flex; }
  .modal {
    background: #0f1a30; border: 1px solid #27405f; border-radius: 8px;
    width: min(520px, 92vw); padding: 20px;
  }
  .modal h3 { color: #eaf2ff; margin-bottom: 12px; }
  .modal input {
    width: 100%; background: #0a1322; border: 1px solid #2b4a6e; border-radius: 4px;
    color: #d5dee8; padding: 8px 10px; margin-bottom: 8px; font-size: 13px;
    font-family: Consolas, monospace; outline: none;
  }
  .modal input:focus { border-color: #2f8cff; }
  .modal .row { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
  .modal .hint { color: #5f7d9e; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>持仓监控</h1>
  <button onclick="openSettings()">设置</button>
</header>

<div class="toolbar">
  <button class="primary" onclick="fetchData()">获取持仓</button>
  <span id="status">就绪</span>
</div>

<div class="groups" id="groups">
  <div class="empty">点击「获取持仓」加载数据</div>
</div>

<div class="mask" id="settingsMask">
  <div class="modal">
    <h3>API 设置</h3>
    <input type="text" id="apiKey" placeholder="API Key" spellcheck="false">
    <input type="password" id="apiSecret" placeholder="API Secret" spellcheck="false">
    <div class="hint">密钥仅保存在本浏览器 localStorage</div>
    <div class="row">
      <button onclick="closeSettings()">取消</button>
      <button class="primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
"use strict";
const FAPI = "https://fapi.binance.com";
const PAIRS = ["BTCUSDT","BTCUSDC","BTCUSD1","BTCU","BTC次季","BTC当季",
  "ETHUSDT","ETHUSDC","ETHUSD1","ETHU","ETH次季","ETH当季",
  "XAUUSDT","XAUTUSDT","PAXGUSDT"];
const GROUPS = [
  {label:"BTC", pairs:["BTCUSDT","BTCUSDC","BTCUSD1","BTCU","BTC次季","BTC当季"]},
  {label:"ETH", pairs:["ETHUSDT","ETHUSDC","ETHUSD1","ETHU","ETH次季","ETH当季"]},
  {label:"黄金", pairs:["XAUUSDT","XAUTUSDT","PAXGUSDT"]},
];
const KEY_STORE = "bc_keys_v1";

function loadKeys(){ try{ return JSON.parse(localStorage.getItem(KEY_STORE)||"{}"); }catch(e){ return {}; } }
function saveKeys(k){ localStorage.setItem(KEY_STORE, JSON.stringify(k)); }
function getKeys(){ const k=loadKeys(); return {key:k.key||"", secret:k.secret||""}; }

// 时间同步
let serverRefMs=0, serverRefPerf=0, syncOk=false;
async function ensureOffset(){
  if(syncOk && performance.now()-serverRefPerf<60000) return;
  try{
    const r = await fetch(FAPI+"/fapi/v1/time");
    const d = await r.json();
    if(d.serverTime>0){ serverRefMs=d.serverTime; serverRefPerf=performance.now(); syncOk=true; }
  }catch(e){}
}
async function nowMs(){
  await ensureOffset();
  return serverRefMs>0 ? Math.round(serverRefMs+(performance.now()-serverRefPerf)) : Date.now();
}

async function hexSign(secret, msg){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(secret),
    {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(msg));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function fetchPositions(key, secret){
  await ensureOffset();
  const params = "timestamp="+(await nowMs())+"&recvWindow=10000";
  const sig = await hexSign(secret, params);
  const r = await fetch(FAPI+"/fapi/v2/positionRisk?"+params+"&signature="+sig, {
    headers:{"X-MBX-APIKEY":key}
  });
  return r.json();
}

function positionInfo(p){
  const amt = parseFloat(p.positionAmt)||0;
  const mark = parseFloat(p.markPrice)||0;
  const unrealized = parseFloat(p.unRealizedProfit)||0;
  let margin = parseFloat(p.positionInitialMargin)||parseFloat(p.isolatedMargin)||parseFloat(p.initialMargin)||0;
  if(margin<=0){
    const notional = Math.abs(parseFloat(p.notional)||(amt*mark));
    const lev = parseFloat(p.leverage)||0;
    if(lev>0 && notional>0) margin = notional/lev;
  }
  const roi = margin>0 ? unrealized/margin*100 : 0;
  const notional = Math.abs(amt)*mark;
  return {amt, mark, unrealized, roi, notional};
}

async function fetchData(){
  const {key, secret} = getKeys();
  const container = document.getElementById("groups");
  if(!key || !secret){
    container.innerHTML = '<div class="empty">请先点「设置」填写 API Key / Secret</div>';
    openSettings();
    return;
  }
  document.getElementById("status").textContent = "正在加载…";
  try{
    const data = await fetchPositions(key, secret);
    if(!Array.isArray(data)) throw new Error("返回异常: "+JSON.stringify(data));
    // 按交易对分组收集持仓
    const posMap = {};
    for(const p of data){
      const amt = parseFloat(p.positionAmt)||0;
      if(amt===0) continue;
      if(!PAIRS.includes(p.symbol)) continue;
      if(!posMap[p.symbol]) posMap[p.symbol] = [];
      posMap[p.symbol].push(p);
    }
    let html = "";
    let totalPos = 0;
    for(const g of GROUPS){
      html += '<div class="group-label">'+g.label+'</div>';
      html += '<div class="cards">';
      // 先排所有多单，再排所有空单
      for(const dir of ["LONG","SHORT"]){
        for(const sym of g.pairs){
          const positions = (posMap[sym] || []).filter(p=>{
            const side = p.positionSide || "";
            const amt = parseFloat(p.positionAmt)||0;
            if(dir==="LONG") return side==="LONG" || (side!=="SHORT" && amt>0);
            return side==="SHORT" || (side!=="LONG" && amt<0);
          });
          if(!positions.length){
            html += '<div class="card" style="opacity:.5">'+
              '<div class="c-sym">'+sym+'</div>'+
              '<div class="c-row"><span class="lbl">方向</span><span>'+(dir==="LONG"?"多":"空")+'</span></div>'+
              '<div class="c-row"><span class="lbl">数量</span><span class="num">-</span></div>'+
              '<div class="c-row"><span class="lbl">回报率</span><span class="num">-</span></div>'+
            '</div>';
            continue;
          }
          for(const p of positions){
            const info = positionInfo(p);
            totalPos++;
            const isLong = dir==="LONG";
            const dirCls = isLong ? "long" : "short";
            const dirTxt = isLong ? "多" : "空";
            const roiCls = info.roi>=0 ? "roi-pos" : "roi-neg";
            const roiTxt = (info.roi>=0?"+":"")+info.roi.toFixed(2)+"%";
            const notionalTxt = "$"+info.notional.toLocaleString("en-US",{maximumFractionDigits:2});
            html += '<div class="card">'+
              '<div class="c-sym">'+sym+'</div>'+
              '<div class="c-row"><span class="lbl">方向</span><span class="'+dirCls+'">'+dirTxt+'</span></div>'+
              '<div class="c-row"><span class="lbl">数量</span><span class="num">'+notionalTxt+'</span></div>'+
              '<div class="c-row"><span class="lbl">回报率</span><span class="num '+roiCls+'">'+roiTxt+'</span></div>'+
            '</div>';
          }
        }
      }
      html += '</div>';
    }
    container.innerHTML = html;
    document.getElementById("status").textContent = "已加载 "+totalPos+" 条持仓 / 共 "+PAIRS.length+" 个交易对 · "+new Date().toLocaleTimeString("zh-CN",{hour12:false});
  }catch(e){
    container.innerHTML = '<div class="empty">加载失败: '+e.message+'</div>';
    document.getElementById("status").textContent = "失败: "+e.message;
  }
}

function openSettings(){
  const {key, secret} = getKeys();
  document.getElementById("apiKey").value = key;
  document.getElementById("apiSecret").value = secret;
  document.getElementById("settingsMask").classList.add("show");
}
function closeSettings(){ document.getElementById("settingsMask").classList.remove("show"); }
function saveSettings(){
  saveKeys({key: document.getElementById("apiKey").value.trim(), secret: document.getElementById("apiSecret").value.trim()});
  closeSettings();
  fetchData();
}

// 初始化
(function(){
  const {key} = getKeys();
  if(key) fetchData();
})();
</script>
</body>
</html>
