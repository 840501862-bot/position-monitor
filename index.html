<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>持仓监控</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
    font-size: 14px; color: #d5dee8; background: #0c1e3e; min-height: 100vh;
  }
  header {
    background: linear-gradient(180deg,#0e1a2c,#0a1322); border-bottom: 1px solid #20334d;
    padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; color: #eaf2ff; margin-right: auto; }
  .toolbar {
    background: #0a1322; border-bottom: 1px solid #20334d; padding: 8px 16px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  button {
    border: 1px solid #2a4d7f; border-radius: 4px; padding: 6px 16px;
    background: #142543; color: #9cc3ff; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: #2f8cff; color: #cfe3ff; }
  button.primary { background: linear-gradient(180deg,#1e7bff,#1460e0); border-color: #2f8cff; color: #fff; }
  #status { color: #4dc3ff; font-size: 12px; }
  .groups { padding: 10px 16px; }
  .group-label {
    font-size: 13px; font-weight: 700; color: #c9ddf5;
    background: #1a3a6e; padding: 6px 12px; border-radius: 6px 6px 0 0;
    border: 1px solid #2c5aa8; border-bottom: none;
  }
  .group-label.sub {
    font-size: 12px; font-weight: 600; color: #8fa8c4; background: #142a52;
    padding: 4px 12px; margin-top: 10px; border-radius: 6px 6px 0 0;
    border: 1px solid #24497f; border-bottom: none;
  }
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px;
    border: 1px solid #2c5aa8; border-radius: 0 6px 6px 6px;
    padding: 10px; background: rgba(20,35,74,.4);
  }
  .card {
    background: #142543; border: 1px solid #2a4d7f;
    border-radius: 6px; padding: 12px 14px; min-width: 0;
  }
  .break { flex-basis: 100%; height: 0; }
  .card .c-sym { font-weight: 700; color: #fff; font-size: 15px; margin-bottom: 7px; }
  /* 行内固定两列：标签固定宽，数值右对齐；数值超长截断省略号，绝不挤压/挪动其他内容 */
  .card .c-row { display: grid; grid-template-columns: 46px minmax(0,1fr); gap: 6px; align-items: baseline; font-size: 12px; line-height: 1.9; }
  .card .c-row .lbl { color: #7d93ab; white-space: nowrap; }
  .card .c-row span:last-child { text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .c-empty { color: #5f7d9e; font-size: 12px; padding: 8px 0; text-align: center; }
  .long { color: #ef4444; font-weight: 700; }
  .short { color: #22c55e; font-weight: 700; }
  .num { font-family: Consolas, monospace; }
  .roi-pos { color: #ef4444; font-weight: 700; }
  .roi-neg { color: #22c55e; font-weight: 700; }
  .empty { text-align: center; padding: 40px; color: #5f7d9e; }
  .mask {
    position: fixed; inset: 0; background: rgba(3,6,12,.7); display: none;
    align-items: center; justify-content: center; z-index: 50;
  }
  .mask.show { display: flex; }
  .modal {
    background: #0f1a30; border: 1px solid #27405f; border-radius: 8px;
    width: min(520px, 92vw); padding: 20px;
  }
  .modal h3 { color: #eaf2ff; margin-bottom: 12px; }
  .modal input {
    width: 100%; background: #0a1322; border: 1px solid #2b4a6e; border-radius: 4px;
    color: #d5dee8; padding: 8px 10px; margin-bottom: 8px; font-size: 13px;
    font-family: Consolas, monospace; outline: none;
  }
  .modal input:focus { border-color: #2f8cff; }
  .modal .row { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
  .modal .hint { color: #5f7d9e; font-size: 11px; margin-top: 4px; }
  /* 设置弹窗多账户行 */
  .arow { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .arow input { flex: 1; min-width: 140px; margin-bottom: 0; }
  .arow .nm { flex: 0 0 90px; min-width: 90px; }
  .arow .del { border: none; background: none; color: #8b98ab; font-size: 18px; cursor: pointer; padding: 4px 8px; line-height: 1; }
  .arow .del:hover { color: #e05c53; }
  .add-acc { margin-top: 2px; }
  /* 手机/窄屏：每行4张卡固定在同一行不往下跑（4列均分） */
  @media (max-width: 720px){
    /* 手机端：同一方向块保持一行，块加大固定宽度，超出部分横向滑动查看 */
    .cards { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; gap: 8px; padding: 8px; }
    .cards .card { flex: 0 0 165px; min-width: 0; }
    .card { padding: 8px 6px; }
    .card .c-sym { font-size: 12px; margin-bottom: 4px; }
    .card .c-row { grid-template-columns: 36px minmax(0,1fr); gap: 4px; font-size: 11px; line-height: 1.7; }
    .card button { font-size: 11px; padding: 2px 0; margin-top: 4px; }
  }
</style>
</head>
<body>

<header>
  <h1>持仓监控</h1>
  <button onclick="openSettings()">设置</button>
</header>

<div class="toolbar">
  <select id="accSel" onchange="onAccSwitch()" style="max-width:200px;padding:6px 8px;border:1px solid #2b4a6e;border-radius:4px;background:#0e1b33;color:#d5dee8;font-size:13px;outline:none"></select>
  <button class="primary" onclick="fetchData()">获取持仓</button>
  <span id="status">就绪</span>
</div>

<div class="groups" id="groups">
  <div class="empty">点击「获取持仓」加载数据</div>
</div>

<div class="mask" id="settingsMask">
  <div class="modal" style="width:min(640px,94vw)">
    <h3>账户 API 设置</h3>
    <div id="accRows"></div>
    <button class="add-acc" onclick="addRow()">+ 添加账户</button>
    <div class="hint">密钥仅保存在本浏览器 localStorage；可添加多个账户分别监控，加仓按钮作用于所在账户</div>
    <div class="row">
      <button onclick="closeSettings()">取消</button>
      <button class="primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
"use strict";
const FAPI = "https://fapi.binance.com";
const DAPI = "https://dapi.binance.com";
const PAIRS = ["BTCUSDT","BTCUSDC","BTCUSD1","BTCU",
  "ETHUSDT","ETHUSDC","ETHUSD1","ETHU",
  "XAUUSDT","XAUTUSDT","PAXGUSDT"];
const GROUPS = [
  {label:"BTC", pairs:["BTCUSDT","BTCUSDC","BTCUSD1","BTCU"]},
  {label:"ETH", pairs:["ETHUSDT","ETHUSDC","ETHUSD1","ETHU"]},
  {label:"黄金", pairs:["XAUUSDT","XAUTUSDT","PAXGUSDT"]},
];
const KEY_STORE = "bc_keys_v1";

// ===== U本位(USDⓈ-M)季度交割合约 =====
// 识别规则：fapi /v1/exchangeInfo 中 contractType=CURRENT_QUARTER(当季)/NEXT_QUARTER(次季)，
// baseAsset 为 BTC/ETH，交易对如 BTCUSDT_261225 / BTCUSDT_270326（USDT 结算）。
// 每季度交割后 symbol 会变化，这里每次加载自动识别，无需手改。
let DELIV = {BTC:[], ETH:[]};
async function ensureDeliveryPairs(){
  try{
    const d = await fetchJson(FAPI+"/fapi/v1/exchangeInfo", 30000);
    const out = {BTC:[], ETH:[]};
    for(const s of (d.symbols||[])){
      const ct = s.contractType || "";
      if(ct!=="CURRENT_QUARTER" && ct!=="NEXT_QUARTER") continue;
      if(s.baseAsset!=="BTC" && s.baseAsset!=="ETH") continue;
      out[s.baseAsset].push({display:s.baseAsset+(ct==="CURRENT_QUARTER"?"当季":"次季"), symbol:s.symbol, ct});
    }
    // 排序：次季在前、当季在后
    for(const k of Object.keys(out)){
      out[k].sort((a,b)=> a.ct===b.ct ? 0 : (a.ct==="NEXT_QUARTER" ? -1 : 1));
    }
    DELIV = out;
  }catch(e){ /* 识别失败则不显示交割卡 */ }
}

function loadKeys(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY_STORE)||"[]");
    if(Array.isArray(d)) return d;
    if(d && d.key) return [{id:1, name:"账户1", key:d.key||"", secret:d.secret||""}];
    return [];
  }catch(e){ return []; }
}
function saveKeys(a){ localStorage.setItem(KEY_STORE, JSON.stringify(a)); }
function getAccounts(){ return loadKeys().filter(a=>a.key && a.secret); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// 时间同步
let serverRefMs=0, serverRefPerf=0, syncOk=false;
async function ensureOffset(){
  if(syncOk && performance.now()-serverRefPerf<60000) return;
  try{
    const d = await fetchJson(FAPI+"/fapi/v1/time", 8000);
    if(d && d.serverTime>0){ serverRefMs=d.serverTime; serverRefPerf=performance.now(); syncOk=true; }
  }catch(e){}
}
async function nowMs(){
  await ensureOffset();
  return serverRefMs>0 ? Math.round(serverRefMs+(performance.now()-serverRefPerf)) : Date.now();
}

async function hexSign(secret, msg){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(secret),
    {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(msg));
  return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// 带超时的 JSON 请求（U本位/币本位通用，避免某个接口卡住拖垮整页）
async function fetchJson(url, timeoutMs, apiKey){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), timeoutMs||15000);
  try{
    const r = await fetch(url, {signal:ctl.signal, headers: apiKey?{"X-MBX-APIKEY":apiKey}:{}});
    const txt = await r.text();
    try{ return JSON.parse(txt); }catch(e){ return txt; }
  }finally{ clearTimeout(t); }
}

async function fetchPositions(key, secret){
  await ensureOffset();
  const params = "timestamp="+(await nowMs())+"&recvWindow=10000";
  const sig = await hexSign(secret, params);
  return fetchJson(FAPI+"/fapi/v2/positionRisk?"+params+"&signature="+sig, 20000, key);
}
// Coin-M 永续持仓
async function fetchDeliveryPositions(key, secret){
  await ensureOffset();
  const params = "timestamp="+(await nowMs())+"&recvWindow=10000";
  const sig = await hexSign(secret, params);
  return fetchJson(DAPI+"/dapi/v1/positionRisk?"+params+"&signature="+sig, 20000, key);
}
// Coin-M 永续合约显示名：BTCUSD_PERP→BTCU, ETHUSD_PERP→ETHU（季度交割合约不展示）
function deliveryDisplayName(sym){
  if(sym.endsWith("_PERP")) return sym.replace("USD_PERP","U");
  return null;
}
function apiBase(host){ return host===DAPI ? "dapi" : "fapi"; }
function coinMAlias(displayName){
  if(displayName==="BTCU") return {host:DAPI, sym:"BTCUSD_PERP"};
  if(displayName==="ETHU") return {host:DAPI, sym:"ETHUSD_PERP"};
  return null;
}
// 带超时的 POST 请求（币安下单用）
async function postJson(url, apiKey){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), 20000);
  try{
    const r = await fetch(url, {method:"POST", headers: apiKey?{"X-MBX-APIKEY":apiKey}:{}, signal:ctl.signal});
    const txt = await r.text();
    try{ return JSON.parse(txt); }catch(e){ return txt; }
  }finally{ clearTimeout(t); }
}
// 交易所精度表（stepSize）缓存
let stepMapCache=null, stepMapDapiCache=null;
async function ensureStepMap(){
  if(stepMapCache) return;
  try{
    const d = await fetchJson(FAPI+"/fapi/v1/exchangeInfo", 30000);
    stepMapCache = {};
    for(const s of (d.symbols||[])){
      const f = (s.filters||[]).find(x=>x.filterType==="LOT_SIZE");
      if(f) stepMapCache[s.symbol] = parseFloat(f.stepSize);
    }
  }catch(e){ stepMapCache = {}; }
}
async function ensureStepMapDapi(){
  if(stepMapDapiCache) return;
  try{
    const d = await fetchJson(DAPI+"/dapi/v1/exchangeInfo", 30000);
    stepMapDapiCache = {};
    for(const s of (d.symbols||[])){
      const f = (s.filters||[]).find(x=>x.filterType==="LOT_SIZE");
      if(f) stepMapDapiCache[s.symbol] = parseFloat(f.stepSize);
    }
  }catch(e){ stepMapDapiCache = {}; }
}
let priceCache={}, priceCacheTs=0;
async function fetchPrice(host, sym){
  const k = host+"|"+sym;
  if(priceCache[k] && Date.now()-priceCacheTs<30000) return priceCache[k];
  const d = await fetchJson(host+"/"+apiBase(host)+"/v1/ticker/price?symbol="+sym, 8000);
  const p = d && parseFloat(d.price);
  if(p>0){ priceCache[k]=p; priceCacheTs=Date.now(); return p; }
  return null;
}
function roundDownToStep(qty, step){
  if(!(step>0) || !(qty>0)) return null;
  const d = Math.max(0, Math.ceil(-Math.log10(step)));
  return Math.floor(qty*Math.pow(10,d))/Math.pow(10,d);
}
// 下单（U本位/币本位通用，带 positionSide 以适配对冲模式）
async function placeOrder(host, sym, side, positionSide, qty, reduceOnly, acc){
  await ensureOffset();
  const parts = ["symbol="+sym, "side="+side, "type=MARKET"];
  if(positionSide) parts.push("positionSide="+positionSide);
  if(qty!=null) parts.push("quantity="+qty);
  if(reduceOnly) parts.push("reduceOnly=true");
  parts.push("timestamp="+(await nowMs()), "recvWindow=10000");
  const key = acc ? acc.key : "", secret = acc ? acc.secret : "";
  const sig = await hexSign(secret, parts.join("&"));
  return postJson(host+"/"+apiBase(host)+"/v1/order?"+parts.join("&")+"&signature="+sig, key);
}
function orderErrText(r){
  if(r && typeof r==="object" && (r.msg || r.code)) return "code "+r.code+" "+r.msg;
  return String(r);
}
// 持仓方向判定：positionSide 优先（对冲模式），缺失时按持仓数量正负判断（单向模式）
function posDir(p){
  const s = p.positionSide || "";
  if(s==="LONG" || s==="SHORT") return s;
  return parseFloat(p.positionAmt)>0 ? "LONG" : "SHORT";
}
// 每个交易对的"加仓"按钮逻辑：按点击卡片的方向操作（绝不加错方向）——
// 无该方向持仓 → 按该方向开100USDT / 该方向ROI>100% → 只平该方向 / 该方向ROI<-100% → 按该方向当前数量加仓
// 同交易对多空双仓（对冲模式）互不干扰：点"多"卡只动多单，点"空"卡只动空单
async function tradePair(displayName, accId, wantDir){
  const accs = getAccounts();
  const acc = accs.find(a=>a.id===accId) || accs[0];
  const status = document.getElementById("status");
  if(!acc){ status.textContent = "请先点「设置」填写 API Key / Secret"; openSettings(); return; }
  const key = acc.key, secret = acc.secret;
  const cm = coinMAlias(displayName);
  // 交割合约显示名 → 真实 symbol（如 "BTC当季" → BTCUSDT_261225）
  let dlSym = null;
  for(const base of ["BTC","ETH"]){
    for(const d of DELIV[base]){ if(d.display===displayName){ dlSym=d.symbol; break; } }
    if(dlSym) break;
  }
  const host = cm ? cm.host : FAPI;
  const rawSym = cm ? cm.sym : (dlSym || displayName);
  const dir = wantDir==="SHORT" ? "SHORT" : "LONG";   // 点击卡片的方向
  const dirTxt = dir==="LONG" ? "多" : "空";
  let doneMsg = "";
  try{
    await Promise.all([ensureStepMap(), ensureStepMapDapi()]);
    status.textContent = "正在获取 "+displayName+" 持仓…";
    const positions = cm ? await fetchDeliveryPositions(key, secret) : await fetchPositions(key, secret);
    const held = (Array.isArray(positions)?positions:[]).filter(p=>
      p.symbol===rawSym && parseFloat(p.positionAmt)!==0);
    // 该方向的持仓（同交易对多空双仓互不干扰）
    const pos = held.find(p=>posDir(p)===dir);
    if(!pos){
      // 无该方向持仓：按点击的方向市价开仓 100 USDT（占位卡点"空"就开空，点"多"就开多）
      const price = await fetchPrice(host, rawSym);
      if(!(price>0)){ status.textContent = displayName+" 获取价格失败，未开仓"; return; }
      const step = cm ? stepMapDapiCache[rawSym] : stepMapCache[rawSym];
      const qty = roundDownToStep(100/price, step);
      if(!(qty>0)){ status.textContent = displayName+" 开仓数量过小（精度 "+step+"，100/价格="+(100/price).toFixed(6)+"），未开仓"; return; }
      status.textContent = "开仓 "+displayName+" "+dirTxt+" "+qty+"（≈100 USDT）…";
      const r = await placeOrder(host, rawSym, dir==="LONG"?"BUY":"SELL", dir, qty, false, acc);
      doneMsg = (r && r.orderId) ? "开仓成功 "+displayName+" "+dirTxt+" "+qty+"（order "+r.orderId+"）" : "开仓失败 "+displayName+"："+orderErrText(r);
    }else{
      const amt = parseFloat(pos.positionAmt);
      const ps = posDir(pos);
      const info = positionInfo(pos);
      if(info.roi > 100){
        // 平仓：只平点击方向的持仓，另一方向的仓位不受影响
        let any = false;
        for(const q of held){
          if(posDir(q)!==ps) continue;
          const qtyStr = q.positionAmt.startsWith("-") ? q.positionAmt.slice(1) : q.positionAmt;
          status.textContent = "平仓 "+displayName+" "+dirTxt+"（ROI "+info.roi.toFixed(2)+"% > 100%）…";
          const r = await placeOrder(host, rawSym, ps==="LONG"?"SELL":"BUY", ps, qtyStr, true, acc);
          if(!(r && r.orderId)){ status.textContent = "平仓失败 "+displayName+"："+orderErrText(r); return; }
          any = true;
        }
        doneMsg = any ? "平仓成功 "+displayName+" "+dirTxt+"（order 已成交）" : displayName+" "+dirTxt+" 无持仓，不操作";
      }else if(info.roi < -100){
        // 加仓：按该方向当前持仓数量原数量加仓（方向与点击卡片一致，绝不加错方向）
        const step = cm ? stepMapDapiCache[rawSym] : stepMapCache[rawSym];
        const qty = roundDownToStep(Math.abs(amt), step);
        if(!(qty>0)){ status.textContent = displayName+" 加仓数量过小，未加仓"; return; }
        status.textContent = "加仓 "+displayName+" "+dirTxt+" "+qty+"（ROI "+info.roi.toFixed(2)+"% < -100%）…";
        const r = await placeOrder(host, rawSym, ps==="LONG"?"BUY":"SELL", ps, qty, false, acc);
        doneMsg = (r && r.orderId) ? "加仓成功 "+displayName+" "+dirTxt+" "+qty+"（order "+r.orderId+"）" : "加仓失败 "+displayName+"："+orderErrText(r);
      }else{
        doneMsg = displayName+" "+dirTxt+" 回报率 "+info.roi.toFixed(2)+"%（-100%~+100% 之间），不操作";
      }
    }
    await fetchData();
    if(doneMsg) document.getElementById("status").textContent = doneMsg;
  }catch(e){
    status.textContent = "操作失败 "+displayName+"："+e.message;
  }
}

function positionInfo(p){
  const amt = parseFloat(p.positionAmt)||0;
  const mark = parseFloat(p.markPrice)||0;
  const unrealized = parseFloat(p.unRealizedProfit)||0;
  let margin = parseFloat(p.positionInitialMargin)||parseFloat(p.isolatedMargin)||parseFloat(p.initialMargin)||0;
  if(margin<=0){
    const notional = Math.abs(parseFloat(p.notional)||(amt*mark));
    const lev = parseFloat(p.leverage)||0;
    if(lev>0 && notional>0) margin = notional/lev;
  }
  const roi = margin>0 ? unrealized/margin*100 : 0;
  const notional = Math.abs(amt)*mark;
  return {amt, mark, unrealized, roi, notional};
}

async function fetchData(accId){
  const accs = getAccounts();
  const container = document.getElementById("groups");
  if(!accs.length){
    container.innerHTML = '<div class="empty">请先点「设置」填写 API Key / Secret</div>';
    openSettings();
    return;
  }
  const acc = accs.find(a=>a.id===accId) || accs[0];
  const sel = document.getElementById("accSel");
  if(sel && String(sel.value) !== String(acc.id)) sel.value = String(acc.id);
  document.getElementById("status").textContent = "正在加载 "+acc.name+" …";
  try{
    await ensureDeliveryPairs();
    const [data, deliveryData] = await Promise.all([
      fetchPositions(acc.key, acc.secret),
      fetchDeliveryPositions(acc.key, acc.secret)
    ]);
    const posMap = {};
    // U本位持仓（含当季/次季交割合约，全量收集，渲染时按需取）
    if(Array.isArray(data)){
      for(const p of data){
        const amt = parseFloat(p.positionAmt)||0;
        if(amt===0) continue;
        if(!posMap[p.symbol]) posMap[p.symbol] = [];
        posMap[p.symbol].push(p);
      }
    }
    // Coin-M 永续持仓：BTCUSD_PERP→BTCU, ETHUSD_PERP→ETHU（季度交割合约不展示）
    if(Array.isArray(deliveryData)){
      for(const p of deliveryData){
        const amt = parseFloat(p.positionAmt)||0;
        if(amt===0) continue;
        const name = deliveryDisplayName(p.symbol);
        if(!name) continue;
        if(!posMap[name]) posMap[name] = [];
        posMap[name].push(p);
      }
    }
    let html = "";
    let totalPos = 0;
    for(const g of GROUPS){
      // 渲染顺序：本组交易对 + 紧跟 BTCU/ETHU 的当季/次季交割合约卡
      const ordered = [];
      for(const sym of g.pairs){
        ordered.push({type:"pair", sym});
        if((g.label==="BTC" && sym==="BTCU") || (g.label==="ETH" && sym==="ETHU")){
          for(const d of (DELIV[g.label]||[])) ordered.push({type:"deliv", display:d.display, sym:d.symbol});
        }
      }
      html += '<div class="group-label">'+g.label+'</div>';
      // 同一币种下：所有交易对的多单持仓数量求和 vs 空单持仓数量求和，谁的数量大谁排在前面
      let longTotal = 0, shortTotal = 0;
      for(const it of ordered){
        for(const p of (posMap[it.sym]||[])){
          const amt = parseFloat(p.positionAmt)||0;
          if(amt===0) continue;
          const side = p.positionSide || (amt>0 ? "LONG" : "SHORT");
          if(side==="SHORT") shortTotal += Math.abs(amt); else longTotal += Math.abs(amt);
        }
      }
      const dirs = longTotal >= shortTotal ? ["LONG","SHORT"] : ["SHORT","LONG"];
      // 同一方向的块固定在同一行：按该方向实际块数均分列宽
      for(const dir of dirs){
        let blocks = "", blockCount = 0;
        for(const it of ordered){
          const sym = it.sym;
          const display = it.type==="deliv" ? it.display : sym;
          const positions = (posMap[sym] || []).filter(p=>{
            const side = p.positionSide || "";
            const amt = parseFloat(p.positionAmt)||0;
            if(dir==="LONG") return side==="LONG" || (side!=="SHORT" && amt>0);
            return side==="SHORT" || (side!=="LONG" && amt<0);
          });
          if(!positions.length){
            blocks += '<div class="card" style="opacity:.5">'+
              '<div class="c-sym">'+display+'</div>'+
              '<div class="c-row"><span class="lbl">方向</span><span>'+(dir==="LONG"?"多":"空")+'</span></div>'+
              '<div class="c-row"><span class="lbl">数量</span><span class="num">-</span></div>'+
              '<div class="c-row"><span class="lbl">回报率</span><span class="num">-</span></div>'+
              '<button onclick="tradePair(\''+display+'\','+acc.id+',\''+dir+'\')" style="width:100%;margin-top:6px;padding:3px 0;font-size:12px">加仓</button>'+
            '</div>';
            blockCount++;
            continue;
          }
          for(const p of positions){
            const info = positionInfo(p);
            totalPos++;
            const isLong = dir==="LONG";
            const dirCls = isLong ? "long" : "short";
            const dirTxt = isLong ? "多" : "空";
            const roiCls = info.roi>=0 ? "roi-pos" : "roi-neg";
            const roiTxt = (info.roi>=0?"+":"")+info.roi.toFixed(2)+"%";
            const notionalTxt = "$"+info.notional.toLocaleString("en-US",{maximumFractionDigits:2});
            blocks += '<div class="card">'+
              '<div class="c-sym">'+display+'</div>'+
              '<div class="c-row"><span class="lbl">方向</span><span class="'+dirCls+'">'+dirTxt+'</span></div>'+
              '<div class="c-row"><span class="lbl">数量</span><span class="num">'+notionalTxt+'</span></div>'+
              '<div class="c-row"><span class="lbl">回报率</span><span class="num '+roiCls+'">'+roiTxt+'</span></div>'+
              '<button onclick="tradePair(\''+display+'\','+acc.id+',\''+dir+'\')" style="width:100%;margin-top:6px;padding:3px 0;font-size:12px">加仓</button>'+
            '</div>';
            blockCount++;
          }
        }
        html += '<div class="cards" style="grid-template-columns:repeat('+blockCount+',1fr)">'+blocks+'</div>';
      }
    }
    container.innerHTML = html;
    const totalPairs = PAIRS.length + DELIV.BTC.length + DELIV.ETH.length;
    document.getElementById("status").textContent = acc.name+" · 已加载 "+totalPos+" 条持仓 / 共 "+totalPairs+" 个交易对 · "+new Date().toLocaleTimeString("zh-CN",{hour12:false});
  }catch(e){
    container.innerHTML = '<div class="empty">加载失败: '+e.message+'</div>';
    document.getElementById("status").textContent = "失败: "+e.message;
  }
}

// 账户下拉框：列出全部账户，切换即重新加载该账户持仓
function buildAccSel(){
  const sel = document.getElementById("accSel");
  if(!sel) return;
  const accs = getAccounts();
  const cur = sel.value;
  sel.innerHTML = "";
  accs.forEach(a=>{
    const o = document.createElement("option");
    o.value = String(a.id);
    o.textContent = a.name;
    sel.appendChild(o);
  });
  if(cur && accs.some(a=>String(a.id)===cur)) sel.value = cur;
}
function onAccSwitch(){
  const sel = document.getElementById("accSel");
  fetchData(sel ? parseInt(sel.value, 10) : undefined);
}

function rowHtml(nm,key,secret){
  return '<div class="arow">'+
    '<input class="nm" value="'+esc(nm)+'" placeholder="账户名" spellcheck="false">'+
    '<input class="ak" value="'+esc(key)+'" placeholder="API Key" autocomplete="off" spellcheck="false">'+
    '<input class="as" value="'+esc(secret)+'" placeholder="API Secret" autocomplete="off" spellcheck="false" type="password">'+
    '<button class="del" onclick="this.parentNode.remove()" title="删除该账户">×</button></div>';
}
function openSettings(){
  const accs = loadKeys();
  document.getElementById("accRows").innerHTML = accs.length
    ? accs.map(a=>rowHtml(a.name, a.key, a.secret)).join("")
    : rowHtml("账户1","","");
  document.getElementById("settingsMask").classList.add("show");
}
function addRow(){
  const n = document.getElementById("accRows").children.length;
  document.getElementById("accRows").insertAdjacentHTML("beforeend", rowHtml("账户"+(n+1),"",""));
}
function closeSettings(){ document.getElementById("settingsMask").classList.remove("show"); }
function saveSettings(){
  const accs = [];
  document.querySelectorAll("#accRows .arow").forEach(row=>{
    const key = row.querySelector(".ak").value.trim();
    const secret = row.querySelector(".as").value.trim();
    if(!key && !secret) return;
    const nm = (row.querySelector(".nm").value||"").trim() || ("账户"+(accs.length+1));
    accs.push({id: Date.now()+accs.length, name: nm, key, secret});
  });
  if(!accs.length){ alert("请至少填写一行 API Key + Secret"); return; }
  saveKeys(accs);
  closeSettings();
  buildAccSel();
  fetchData();
}

// 初始化
(function(){
  if(getAccounts().length){ buildAccSel(); fetchData(); }
})();
</script>
